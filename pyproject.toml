[project]
name = "freerun"
version = "0.1.0"
description = "Ultra-fast GPU-accelerated Piano Visualizer"
readme = "README.md"
authors = [
    { name = "HeapHeapHooray", email = "heapheaphooray@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "moderngl>=5.13.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "tqdm>=4.70.1",
]

[project.scripts]
freerun = "freerun.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
